# Alembic configuration (SCAFFOLD — fill in when real migrations are written).
# The backend agents must set sqlalchemy.url and confirm script_location
# against the actual migrations tree before generating the first revision.

[alembic]
script_location = migrations
# sqlalchemy.url = postgresql://pazuzu:pazuzu@postgres:5432/pazuzu

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
